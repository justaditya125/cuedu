<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>We have moved | Centurion University Online</title>
  <link rel="icon" href="/assets/img/logo.png" type="image/png">
  <noscript><meta http-equiv="refresh" content="8;url=https://cutmonline.in/"></noscript>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#07204f 0%,#0d3b8c 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1b2a41;line-height:1.6}
    .card{width:100%;max-width:560px;background:#fff;border-radius:18px;padding:36px 32px 30px;text-align:center;box-shadow:0 28px 60px rgba(0,0,0,0.35)}
    .card img{display:block;height:92px;width:auto;margin:0 auto 18px}
    .tag{display:inline-block;background:#fff4e5;color:#c2410c;border:1px solid #ffd9c2;border-radius:999px;padding:4px 14px;font-size:0.78rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:12px}
    h1{font-size:1.65rem;line-height:1.25;color:#0a2350;margin-bottom:12px}
    p{color:#475569;font-size:1rem;margin-bottom:10px}
    .domains{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0 6px;font-size:1.05rem;font-weight:700}
    .old{color:#64748b;text-decoration:line-through}
    .arrow{color:#ef5a1a}
    .new{color:#0a2350;background:#eef3fc;border-radius:8px;padding:4px 12px}
    .count{font-size:0.95rem;color:#64748b;margin:14px 0 18px}
    .go{display:inline-block;background:linear-gradient(135deg,#ef5a1a,#d94f18);color:#fff;text-decoration:none;font-weight:700;font-size:1rem;padding:13px 30px;border-radius:9px;box-shadow:0 8px 20px rgba(217,79,24,0.3)}
    .go:hover{filter:brightness(1.05)}
    .small{font-size:0.85rem;color:#64748b;margin-top:16px;margin-bottom:0}
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/img/logo-cutm.png" alt="Centurion University of Technology and Management">
    <div class="tag">We have moved</div>
    <h1>Our website address has changed</h1>
    <p>Centurion University Online is now at a new address. The old address has been replaced.</p>
    <div class="domains" aria-label="Address change">
      <span class="old" id="old-host">cuedu.in</span><span class="arrow" aria-hidden="true">&rarr;</span><span class="new">cutmonline.in</span>
    </div>
    <p class="count" id="count">Taking you to the new website in <strong id="secs">5</strong> seconds&hellip;</p>
    <a class="go" id="go" href="https://cutmonline.in/">Go to cutmonline.in now</a>
    <p class="small">Please update your bookmarks to <strong>cutmonline.in</strong>.</p>
  </main>
  <script src="/assets/js/moved.js"></script>
</body>
</html>
